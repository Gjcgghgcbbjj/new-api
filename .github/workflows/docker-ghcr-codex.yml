name: Publish Codex Docker image to GHCR

on:
  push:
    branches:
      - codex/responses-chat-bridge
  workflow_dispatch:

env:
  IMAGE_TAG: codex-latest

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Prepare image metadata
        id: meta
        shell: bash
        run: |
          GHCR_REPOSITORY="${GITHUB_REPOSITORY,,}"
          VERSION="codex-$(date +'%Y%m%d')-${GITHUB_SHA::7}"
          echo "$VERSION" > VERSION
          echo "image=ghcr.io/${GHCR_REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker labels
        id: labels
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.meta.outputs.image }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ env.IMAGE_TAG }}
            ${{ steps.meta.outputs.image }}:codex-responses-chat-bridge
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
          labels: ${{ steps.labels.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image summary
        run: |
          echo "### Published image" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.image }}:${{ env.IMAGE_TAG }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.image }}:codex-responses-chat-bridge" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
